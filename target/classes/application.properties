# =============================================
# LUNAR BASE CONTROL API - Configuration
# =============================================

spring.application.name=lunar-base-api
server.port=8081

# H2 - File Mode (persistente)
spring.datasource.url=jdbc:h2:file:./data/lunarbasedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=lunarbase
spring.datasource.password=lunar2024

# H2 Console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
